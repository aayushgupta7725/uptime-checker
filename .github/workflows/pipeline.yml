name: Build and Push Docker Image

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check HTML files exist
        run: |
          if [ -z "$(find . -name '*.html')" ]; then
            echo "ERROR: No HTML files found!"
            exit 1
          else
            echo "OK: HTML files found"
          fi

      - name: Check JS files exist
        run: |
          if [ -z "$(find . -name '*.js')" ]; then
            echo "ERROR: No JS files found!"
            exit 1
          else
            echo "OK: JS files found"
          fi

      - name: Check CSS files exist
        run: |
          if [ -z "$(find . -name '*.css')" ]; then
            echo "ERROR: No CSS files found!"
            exit 1
          else
            echo "OK: CSS files found"
          fi

  docker:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        run: docker build -t uptime-checker .

      - name: Tag image
        run: docker tag uptime-checker aayushgupta7725/uptime-checker:latest

      - name: Push image to Docker Hub
        run: docker push aayushgupta7725/uptime-checker:latest